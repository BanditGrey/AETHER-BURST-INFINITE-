<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AETHER BURST: INFINITE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" media="print" onload="this.media='all'">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/style.css?v=proc1-0810" />
</head>
<body>
  <div id="app">

    <!-- TOPO -->
    <header id="topbar">
      <div class="brand">
        <div class="logo">⚡</div>
        <div class="brand-text">
          <div class="title">AETHER BURST<span>: INFINITE</span></div>
          <div class="slogan">Burst Beyond Limits.</div>
        </div>
      </div>

      <div class="zone-badge" id="zoneBadge">
        <span class="zone-energy" id="zoneEnergy">🌿</span>
        <div>
          <div class="zone-name" id="zoneName">Verdant Rift</div>
          <div class="zone-sub" id="zoneSub">Zona 1 · Nível 1</div>
        </div>
      </div>

      <div class="resources">
        <div class="res" title="Aether Shards"><span class="ico">💎</span><span id="rShards">0</span></div>
        <div class="res" title="Rift Tickets"><span class="ico">⭐</span><span id="rTickets">0</span></div>
        <div class="res" title="Infinity Fragments"><span class="ico">💠</span><span id="rFragments">0</span></div>
      </div>

      <div class="top-controls">
        <div class="speed-toggle" id="speedToggle">
          <button data-speed="1" class="active">1×</button>
          <button data-speed="2">2×</button>
          <button data-speed="3">3×</button>
          <button data-speed="6" id="burstModeBtn">BURST</button>
        </div>
        <button class="icon-btn" id="muteBtn" title="Som">🔊</button>
      </div>
    </header>

    <!-- CAMPO DE BATALHA -->
    <main id="stage">
      <canvas id="game"></canvas>
      <div id="banner"></div>
      <div id="zonewipe" class="hidden"><div class="zw-band"><div class="zw-name" id="zwName"></div><div class="zw-sub" id="zwSub"></div></div></div>
      <div id="pauseOv" class="hidden"><div class="p-ico">⏸</div><div>PAUSADO</div><div class="p-hint">ESPAÇO para retomar</div></div>
      <button id="compactToggle" title="Modo Companion">{{--}}</button>
    </main>

    <!-- BARRAS DE BURST + RESONANCE -->
    <section id="burstbars"></section>

    <!-- NAVEGAÇÃO -->
    <nav id="navbar">
      <button class="nav-btn active" data-view="march"><span>⚔️</span>Marcha</button>
      <button class="nav-btn" data-view="squad"><span>🛡️</span>Esquadrão</button>
      <button class="nav-btn" data-view="gear"><span>⚔️</span>Equipar</button>
      <button class="nav-btn" data-view="dungeons"><span>🌀</span>Dungeons</button>
      <button class="nav-btn" data-view="codex"><span>📖</span>Codex</button>
      <button class="nav-btn" data-view="infinity"><span>💠</span>Infinity</button>
      <button class="nav-btn" data-view="ascension"><span>⭐</span>Ascensão</button>
      <button class="nav-btn" data-view="progresso" title="Dashboard de progresso do projeto"><span>📊</span>Progresso</button>
    </nav>

    <!-- PAINÉIS -->
    <div id="panel-overlay" class="hidden">
      <div class="panel" id="panel">
        <button class="panel-close" id="panelClose">✕</button>
        <div id="panelContent"></div>
      </div>
    </div>

    <!-- REPORT (offline / burst report) -->
    <div id="modal-report" class="hidden">
      <div class="report-box">
        <h2>⚡ BURST REPORT</h2>
        <p class="report-away" id="reportAway"></p>
        <div class="report-stats" id="reportStats"></div>
        <h3>RECOMPENSAS</h3>
        <div class="report-rewards" id="reportRewards"></div>
        <button class="big-btn" id="reportCollect">COLETAR TUDO</button>
      </div>
    </div>

    <div id="toast"></div>

    <!-- SPLASH / TELA DE TÍTULO -->
    <div id="splash">
      <div class="sp-inner">
        <div class="sp-logo">⚡</div>
        <h1 class="sp-title">AETHER BURST<span>: INFINITE</span></h1>
        <div class="sp-tag">Burst Beyond Limits</div>
        <button id="splashStart" class="sp-btn">▶ TOCAR PARA COMEÇAR</button>
        <div class="sp-hint">progresso salvo localmente no navegador</div>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=proc1-0810"></script>
  <script src="js/fx.js?v=proc1-0810"></script>
  <script src="js/engine.js?v=proc1-0810"></script>
  <script src="js/pixi.js?v=proc1-0810"></script>
  <script src="js/main.js?v=proc1-0810"></script>
</body>
</html>
